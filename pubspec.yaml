name: resqnav
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # Google Maps
  google_maps_flutter: ^2.2.0

  # App routing
  go_router: ^10.0.0

  # Location
  geolocator: ^9.0.0
  geocoding: ^2.1.0

  # HTTP/API support
  http: ^0.13.0

  # URL launcher for opening maps
  url_launcher: ^6.1.0

  # Share functionality for SOS alerts
  share_plus: ^7.0.0

  # Icons
  lucide_icons: ^0.88.0
  shared_preferences: ^2.2.0
  google_fonts: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true