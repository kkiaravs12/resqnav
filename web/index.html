<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ResQNav - Emergency Response App">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ResQNav">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>ResQNav</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API -->
  <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBbsB1UQYtHbRBTuMk3YRrKgjEH8GpZEQQ&libraries=places,geometry"></script>

  <!-- Leaflet for web map fallback -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>

  <script>
    var resqnavMap = null;

    // Initialize Leaflet map for web
    function initResQNavMap(containerId) {
      if (resqnavMap) return resqnavMap;
      
      const container = document.getElementById(containerId);
      if (!container) {
        console.warn('Map container not found: ' + containerId);
        return null;
      }

      // Default to Mumbai
      resqnavMap = L.map(containerId).setView([19.0760, 72.8777], 13);
      
      // OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }).addTo(resqnavMap);

      return resqnavMap;
    }

    // Add marker to map
    function addMarkerToMap(lat, lng, title) {
      if (!resqnavMap) return;
      L.marker([lat, lng]).addTo(resqnavMap)
        .bindPopup(title);
    }

    // Center map on location
    function centerMapOnLocation(lat, lng) {
      if (!resqnavMap) return;
      resqnavMap.setView([lat, lng], 15);
    }

    // ResQNav Places - used by explore_page_web.dart
    function initResQNavPlaces(containerId, callback) {
      try {
        if (typeof google === 'undefined') {
          console.warn('Google Maps not loaded yet');
          return;
        }
        var input = document.getElementById(containerId);
        if (!input) {
          console.warn('Element not found: ' + containerId);
          return;
        }
        var autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.addListener('place_changed', function () {
          var place = autocomplete.getPlace();
          if (place && place.geometry) {
            callback(
              place.name || '',
              place.formatted_address || '',
              place.geometry.location.lat(),
              place.geometry.location.lng()
            );
          }
        });
      } catch (e) {
        console.error('initResQNavPlaces error:', e);
      }
    }

    // ResQNav Route - used by explore_page_web.dart
    function computeResQNavRoute(originLat, originLng, destLat, destLng, travelMode, callback) {
      try {
        if (typeof google === 'undefined') {
          callback('[]', 0, 0);
          return;
        }
        var directionsService = new google.maps.DirectionsService();
        var mode = travelMode === 'WALKING'
          ? google.maps.TravelMode.WALKING
          : google.maps.TravelMode.DRIVING;

        directionsService.route({
          origin: new google.maps.LatLng(originLat, originLng),
          destination: new google.maps.LatLng(destLat, destLng),
          travelMode: mode
        }, function (result, status) {
          if (status === 'OK' && result.routes.length > 0) {
            var leg = result.routes[0].legs[0];
            var points = google.maps.geometry
              ? google.maps.geometry.encoding.decodePath(
                  result.routes[0].overview_polyline
                ).map(function (p) {
                  return { lat: p.lat(), lng: p.lng() };
                })
              : [];
            var dist = leg.distance ? leg.distance.value / 1000 : 0;
            var dur = leg.duration ? leg.duration.value / 60 : 0;
            callback(JSON.stringify(points), dist, dur);
          } else {
            callback('[]', 0, 0);
          }
        });
      } catch (e) {
        console.error('computeResQNavRoute error:', e);
        callback('[]', 0, 0);
      }
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
